modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/KeiNodens/aibou-mc/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
# クライアント側のみで完結するmod。サーバー側に無くても接続できるようバージョンチェックを無視させる
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

# Jadeはあれば使うsoft dependency (look_infoのリッチ化)。未導入でも動く
[[dependencies.${mod_id}]]
modId = "jade"
mandatory = false
versionRange = "[11,)"
ordering = "NONE"
side = "CLIENT"
